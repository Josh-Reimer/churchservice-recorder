version: "3.8"

services:
  recorder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: church-recorder
    restart: unless-stopped
    command: python3 new_recorder.py

    # Environment variables (DO NOT use env_file for secrets in production)
    environment:
      - TZ=${TZ:-UTC}
      - PYTHONPATH=/app
      # Pass secrets via environment variables instead of .env file
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TIMEZONE=${TIMEZONE:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - STREAM_URL=${STREAM_URL}
      - STREAM_STATUS_URL=${STREAM_STATUS_URL}
      # Add other environment variables as needed
      - STREAM_CONFIG_FILE=/config/streams.yml

    # Volumes for persistent data
    volumes:
      - ./recordings:/app/recordings:rw
      - ./transcriptions:/app/transcriptions:rw
      - ./config:/app/config:rw
      - ./models:/app/models:ro  # Mount Whisper model as read-only volume
      - ./logs:/app/logs:rw  # app.log + rotations, kept across rebuilds
      - /etc/localtime:/etc/localtime:ro  # Sync timezone with host
    
    # Network configuration
    networks:
      - recorder-network
    
    # No healthcheck: the recorder has no port to probe, and if its process
    # dies the container exits and `restart: unless-stopped` brings it back.

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  webserver:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: church-webserver
    restart: unless-stopped
    ports:
      - "5003:5003"  # Expose port 5000 for the web server
    command: python3 webserver.py
    volumes:
      - ./recordings:/app/recordings:rw
      - ./transcriptions:/app/transcriptions:rw
      - ./config:/app/config:rw
    environment:
      - TZ=${TZ:-UTC}
      - PYTHONPATH=/app
      # Admin login for the config editor — see `python set_admin_password.py`
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-1}
      # cloudflared (ubuntuserver) LAN + Tailscale addresses — only these may set CF-Connecting-IP
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-192.168.0.20,100.78.23.97}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  recorder-network:
    driver: bridge

# Optional: Add volumes for better data management
volumes:
  recordings-data:
  transcriptions-data: