<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="appicon.png" type="image/png" />
  <title>ByteWorship Recordings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media (prefers-color-scheme: dark) {
      body {
      background-color: #3d854b;
      color: #c9c4c4;
      }
      .bg-white\/10 {
      background-color: rgba(124, 104, 104, 0.08) !important;
      }
      audio {
      background: transparent;
      color-scheme: dark;
      border-radius: 0.5rem;
      width: 100%;
      }
    }
    @media (prefers-color-scheme: light) {
      body {
        background-color: #e7f5e7;
        color: #1a2e1a;
      }
      .bg-white\/10 {
        background-color: rgba(0,0,0,0.06) !important;
      }
      audio {
        background: #f3fdf3;
        color-scheme: light;
        border-radius: 0.5rem;
        width: 100%;
      }
    }
    audio {
        background-color: rgb(16, 82, 33);
      outline: none;
      box-shadow: 0 2px 8px 0 rgba(63, 202, 51, 0.08);
      margin-bottom: 0.5rem;
    }
    body {
     background-color: #3d854b;
      color: #c9c4c4;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      overflow-x: hidden;
    }
    
  </style>
</head>
<body class="text-white p-6">


  <!-- App Icon + Title -->
<div class="flex items-center justify-center gap-4 mb-10">
  <img 
    src="appicon.png" 
    alt="App Icon"
    class="w-20 h-20 rounded-2xl shadow-lg object-cover"
    style="border-radius:18px;"
  />

  <h1 class="text-3xl font-bold">
    Church Recordings
  </h1>
</div>


  <!-- Recordings List -->
  <div class="max-w-3xl mx-auto space-y-6">
   
{% for file in files %}
    <div class="bg-white/10 backdrop-blur-sm p-4 rounded-xl shadow-lg">
      <h2 class="text-xl font-semibold mb-2">{{ file }}</h2>
      <audio controls class="w-full mb-2">
      <source src="{{ url_for('serve_recording', filename=file) }}" type="audio/mpeg" />
      Your browser does not support the audio element.
      </audio>
      <div class="text-sm text-green-300 mb-2">Length: {{ audio_lengths[file]}}</div>
      <details class="mt-2">
      <summary class="cursor-pointer text-green-200 hover:underline">Show Transcription</summary>
      <div class="mt-2 whitespace-pre-line text-green-100 text-sm">
        {{ transcriptions[file] }}
      </div>
      </details>
    </div>
{% endfor %}
  </div>

  
  <footer class="text-center mt-10 text-sm text-gray-400">
    &copy; 2025 ByteWorship. All rights reserved.
  </footer>
  <div class="logout-btn">
      <button class="fixed bottom-4 right-4 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition duration-300 ease-in-out">
            <a href="{{ url_for('logout') }}">Logout</a>
            </button>
        </div>
</body>
</html>
